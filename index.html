<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICS3U Website Portfolios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #0a0a0b;
      --foreground: #fafafa;
      --card: #141416;
      --card-hover: #1c1c1f;
      --border: #27272a;
      --border-hover: #3f3f46;
      --muted: #71717a;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --ring: rgba(59, 130, 246, 0.3);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Animated background gradient */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 600px;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.15), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      padding: 80px 0 60px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 24px;
      animation: fadeInUp 0.6s ease-out;
    }

    .badge svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(to bottom, var(--foreground), var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInUp 0.6s ease-out 0.1s both;
    }

    .subtitle {
      font-size: 1.125rem;
      color: var(--muted);
      max-width: 500px;
      margin: 0 auto 48px;
      animation: fadeInUp 0.6s ease-out 0.2s both;
    }

    /* Search */
    .search-wrapper {
      position: relative;
      max-width: 480px;
      margin: 0 auto 16px;
      animation: fadeInUp 0.6s ease-out 0.3s both;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 14px 16px 14px 48px;
      font-size: 1rem;
      font-family: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--foreground);
      outline: none;
      transition: all 0.2s ease;
    }

    #search::placeholder {
      color: var(--muted);
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* Stats */
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 48px;
      animation: fadeInUp 0.6s ease-out 0.4s both;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--foreground);
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding-bottom: 80px;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeInUp 0.5s ease-out both;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--foreground);
      text-decoration: none;
      transition: color 0.2s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-title:hover {
      color: var(--accent-hover);
    }

    .card-links {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      color: var(--accent);
      text-decoration: none;
      padding: 8px 14px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .card-link:hover {
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent-hover);
    }

    .card-link svg {
      width: 14px;
      height: 14px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.813rem;
      color: var(--muted);
    }

    .card-meta svg {
      width: 14px;
      height: 14px;
    }

    /* Loading state */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .empty svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty p {
      font-size: 1rem;
    }

    /* Error state */
    .error {
      text-align: center;
      padding: 40px 20px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      color: #fca5a5;
    }

    /* Footer */
    footer {
      padding: 40px 0;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    footer p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Responsive */
    @media (max-width: 640px) {
      header {
        padding: 60px 0 40px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .stats {
        gap: 24px;
      }

      .card-links {
        flex-direction: column;
        gap: 8px;
      }

      .card-link {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  
  <div class="container">
    <header>
      <div class="badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
          <path d="M9 18c-4.51 2-5-2-7-2"/>
        </svg>
        GitHub Classroom
      </div>
      <h1>ICS3U Website Portfolios</h1>
      <p class="subtitle">Explore student websites from the ICS3U course. Click on any card to view their portfolio.</p>
      
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="search" placeholder="Search by username..." autocomplete="off">
      </div>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="totalCount">-</div>
          <div class="stat-label">Total Portfolios</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="filteredCount">-</div>
          <div class="stat-label">Showing</div>
        </div>
      </div>
    </header>

    <main>
      <div id="portfolioGrid" class="grid">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading portfolios...</p>
        </div>
      </div>
    </main>

    <footer>
      <p>Built for <a href="https://github.com/ICS3U-2025-26" target="_blank" rel="noopener noreferrer">ICS3U-2025-26</a></p>
    </footer>
  </div>

  <script>
    const ORG = "ICS3U-2025-26";
    const PREFIX = "website-portfolio-";

    // ─────────────────────────────────────────────────────────────────────────
    // STUDENT NAME OVERRIDES
    // Map a GitHub username to a display name shown on the card.
    // Add as many entries as you need. Usernames not listed here will fall
    // back to showing their GitHub username.
    //
    // Format:  "github-username": "Display Name",
    // Example: "ghostrecon211":   "John D.",
    // ─────────────────────────────────────────────────────────────────────────
    const NAME_MAP = {
      "rongfeng1203": "Rina F.",
      // "coolgamer99":   "Jane S.",
    };

    const grid = document.getElementById("portfolioGrid");
    const search = document.getElementById("search");
    const totalCountEl = document.getElementById("totalCount");
    const filteredCountEl = document.getElementById("filteredCount");

    async function getRepos(page = 1, allRepos = []) {
      const url = `https://api.github.com/orgs/${ORG}/repos?per_page=100&page=${page}`;
      
      try {
        const response = await fetch(url);
        const repos = await response.json();

        if (!Array.isArray(repos)) {
          grid.innerHTML = `
            <div class="error">
              <p>Could not load repositories. Please check the organization name and repository visibility.</p>
            </div>
          `;
          return [];
        }

        allRepos = allRepos.concat(repos);

        if (repos.length === 100) {
          return getRepos(page + 1, allRepos);
        }

        return allRepos;
      } catch (error) {
        grid.innerHTML = `
          <div class="error">
            <p>Failed to fetch repositories. Please try again later.</p>
          </div>
        `;
        return [];
      }
    }

    function usernameFromRepo(repoName) {
      return repoName.replace(PREFIX, "");
    }

    function displayName(username) {
      return NAME_MAP[username] || username;
    }

    function siteUrl(repoName) {
      return `https://${ORG}.github.io/${repoName}/`;
    }

    function getInitials(username) {
      return username.slice(0, 2).toUpperCase();
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      
      if (diffDays === 0) {
        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
        if (diffHours === 0) {
          const diffMins = Math.floor(diffMs / (1000 * 60));
          return `${diffMins} minute${diffMins !== 1 ? 's' : ''} ago`;
        }
        return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
      } else if (diffDays === 1) {
        return 'Yesterday';
      } else if (diffDays < 7) {
        return `${diffDays} days ago`;
      } else if (diffDays < 30) {
        const weeks = Math.floor(diffDays / 7);
        return `${weeks} week${weeks !== 1 ? 's' : ''} ago`;
      } else {
        return date.toLocaleDateString('en-US', { 
          month: 'short', 
          day: 'numeric',
          year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
        });
      }
    }

    function render(repos, total) {
      if (repos.length === 0) {
        grid.innerHTML = `
          <div class="empty" style="grid-column: 1 / -1;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
            <p>No portfolios found matching your search.</p>
          </div>
        `;
        filteredCountEl.textContent = "0";
        return;
      }

      filteredCountEl.textContent = repos.length;
      grid.innerHTML = "";

      repos.forEach((repo, index) => {
        const username = usernameFromRepo(repo.name);
        const lastPush = formatDate(repo.pushed_at);

        const card = document.createElement("div");
        card.className = "card";
        card.style.animationDelay = `${index * 0.05}s`;

        const label = displayName(username);
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">${getInitials(label)}</div>
            <a href="${siteUrl(repo.name)}" target="_blank" rel="noopener noreferrer" class="card-title">${label}</a>
          </div>
          <div class="card-links">
            <a href="${siteUrl(repo.name)}" target="_blank" rel="noopener noreferrer" class="card-link">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" x2="21" y1="14" y2="3"/>
              </svg>
              View Portfolio
            </a>
          </div>
          <div class="card-meta">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Last updated: ${lastPush}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    async function main() {
      const repos = await getRepos();

      const portfolioRepos = repos
        .filter(repo => repo.name.startsWith(PREFIX))
        .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));

      totalCountEl.textContent = portfolioRepos.length;
      render(portfolioRepos, portfolioRepos.length);

      search.addEventListener("input", () => {
        const query = search.value.toLowerCase().trim();

        const filtered = portfolioRepos.filter(repo => {
          const username = usernameFromRepo(repo.name);
          const label = displayName(username);
          return repo.name.toLowerCase().includes(query) || label.toLowerCase().includes(query);
        });

        render(filtered, portfolioRepos.length);
      });
    }

    main();
  </script>
</body>
</html>
